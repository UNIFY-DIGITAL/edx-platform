<%page expression_filter="h" args="" />
<%inherit file="/main.html" />

<%block name="title">Programs</%block>

<%block name="content">
<div class="container mt-4">
    <h2 class="mb-4">Programs</h2>

    <div id="programs-container" class="row">
        <p>Loading programs...</p>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    fetch("https://discovery.unify.university/api/v1/programs/")
        .then(response => response.json())
        .then(data => {
            const programs = data.results || data;
            const container = document.getElementById("programs-container");
            container.innerHTML = "";

            programs.forEach(program => {
                const card = document.createElement("div");
                card.className = "col-md-4 mb-3";

                card.innerHTML = '\
                    <div class="card">\
                        <div class="card-body">\
                            <h4>' + program.title + '</h4>\
                            <p>' + (program.subtitle || "") + '</p>\
                            <a class="btn btn-primary" href="/login?next=/program/' + program.uuid + '">\
                                View Program\
                            </a>\
                        </div>\
                    </div>';

                container.appendChild(card);
            });
        })
        .catch(err => {
            document.getElementById("programs-container").innerHTML =
                "<p>Error loading programs.</p>";
        });
});
</script>

</%block>
